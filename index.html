<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1e1f22">
<title>Kahlo-Catan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kahlo-Catan">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* ============================================================
   Kahlo-Catan – Spieltisch auf Schiefer: bemalte Pappkacheln,
   Elfenbein-Chips, Holzfiguren und Messing
   ============================================================ */
:root {
  --sea: #2e3034; --sea-d: #1e1f22; --sea-l: #44464c;
  --ink: #2e1e14; --bone: #f2e6cc; --bone-d: #dccba6;
  --panel: #1e1f22; --panel-2: #36383d; --line: rgba(233, 207, 142, .2);
  --mari: #c9a04a; --mari-d: #7a5f25; --mari-l: #e9cf8e; --rosa: #a8402f; --turq: #3e8e7e;
  --muted: #b9b3a6; --muted-ink: #6b4e36;
  --f-display: 'Zilla Slab', Georgia, serif;
  --f-body: 'Source Sans 3', system-ui, sans-serif;
  --r: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 17px/1.45 var(--f-body); color: var(--bone);
  background-color: var(--sea);
  background-image: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, .05), transparent 55%), repeating-linear-gradient(125deg, rgba(0, 0, 0, .08) 0 1px, transparent 1px 14px);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.1; margin: 0 0 .5em; letter-spacing: .01em; }
h1 { font-size: clamp(30px, 8vw, 44px); }
h2 { font-size: 24px; }
h3 { font-size: 18px; margin-top: 1em; color: var(--muted); }
:focus-visible { outline: 3px solid var(--mari); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 15px; margin: .4em 0; }
.center { text-align: center; }
small { font-size: 13px; }

/* ---------- Knöpfe ---------- */
.btn {
  appearance: none; border: 1.5px solid var(--mari); background: transparent; color: var(--mari-l);
  border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.pri { background: var(--mari); border-color: var(--mari); color: var(--ink); box-shadow: 0 3px 0 var(--mari-d); font-family: var(--f-display); }
.btn.ghost { border-color: var(--line); }
.btn.end { background: var(--rosa); border-color: var(--rosa); color: #fff; box-shadow: 0 3px 0 #5e1f15; }
.btn.block { width: 100%; }
.btn.big { min-height: 52px; font-size: 19px; padding-inline: 26px; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 15px; }
.btn:not(:disabled):active { transform: translateY(1px); }
.ib { appearance: none; border: 0; background: transparent; color: var(--mari); width: 44px; height: 44px; font-size: 22px; cursor: pointer; border-radius: 12px; }
.link { appearance: none; border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1; }
.x { appearance: none; border: 0; background: none; color: var(--muted); font-size: 22px; width: 40px; height: 40px; cursor: pointer; }

/* ---------- Startseite und Formulare ---------- */
.home, .page { max-width: 560px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 40px; display: grid; gap: 18px; }
.brand { text-align: center; padding-top: 12px; }
.hero-tiles { width: 170px; height: 160px; display: block; margin: 0 auto 6px; filter: drop-shadow(0 5px 4px rgba(0, 0, 0, .55)); }
.brand h1 { font-size: clamp(42px, 13vw, 64px); margin: 0; color: var(--mari-l); text-shadow: 0 3px 0 rgba(0, 0, 0, .45); }
.brand p { margin: .3em 0 0; color: var(--muted); }
.panel { background: var(--panel); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; border: 1px solid var(--line); box-shadow: 0 6px 14px rgba(0, 0, 0, .3); }
.panel h2 { margin: 0; }
.note { background: rgba(242, 165, 22, .14); border-left: 4px solid var(--mari); padding: 8px 12px; margin: 0; border-radius: 0; }
.joinrow { display: flex; gap: 10px; }
.joinrow input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .12em; text-align: center; font-weight: 700; }
input[type=text], input:not([type]), input[name=name], input[name=code], input[type=number], select, .lp input {
  background: var(--bone); color: var(--ink); border: 0; border-radius: 12px; padding: 11px 14px; min-height: 46px; width: 100%;
}
.games { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.games li { display: flex; align-items: center; gap: 4px; }
.gl { flex: 1; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; text-align: left; background: var(--panel-2); border: 0; border-radius: 12px; padding: 12px 14px; cursor: pointer; min-width: 0; }
.gl span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.foot { text-align: center; color: var(--muted); }
.back { appearance: none; border: 0; background: none; color: var(--muted); justify-self: start; padding: 6px 0; cursor: pointer; }
.form { display: grid; gap: 16px; }
fieldset { border: 0; background: var(--panel); border-radius: var(--r); padding: 16px; margin: 0; display: grid; gap: 10px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 700; font-size: 20px; float: left; width: 100%; padding: 0; margin-bottom: 4px; }
.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mapc input, .seg input, .colors input, .chk input { position: absolute; opacity: 0; pointer-events: none; }
.mapc span { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); cursor: pointer; height: 100%; }
.mapc small { color: var(--muted); font-size: 13px; line-height: 1.3; }
.mapc input:checked + span { border-color: var(--mari); background: rgba(242, 165, 22, .12); }
.mapc input:focus-visible + span, .seg input:focus-visible + span, .colors input:focus-visible + span, .chk input:focus-visible + span { outline: 3px solid var(--mari); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg span { display: block; text-align: center; padding: 9px 4px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 15px; }
.seg input:checked + span { background: var(--bone); color: var(--ink); }
.chk { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.chk span { display: grid; }
.chk small { color: var(--muted); }
.chk { position: relative; padding-left: 38px; }
.chk::before { content: ''; position: absolute; left: 0; top: 1px; width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--mari); }
.chk:has(input:checked)::before { background: var(--mari); border-color: var(--mari); }
.chk:has(input:checked)::after { content: ''; position: absolute; left: 9px; top: 5px; width: 7px; height: 13px; border: solid var(--ink); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.num { display: flex; align-items: center; gap: 12px; }
.num input { width: 90px; }
.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.colors span { display: block; width: 38px; height: 38px; border-radius: 50%; background: var(--c); border: 3px solid var(--panel); box-shadow: 0 0 0 2px var(--line); cursor: pointer; }
.colors input:checked + span { box-shadow: 0 0 0 3px var(--mari); }
.colors input:disabled + span { opacity: .25; cursor: not-allowed; }
.lp { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.dot { width: 18px; height: 18px; border-radius: 50%; background: var(--c); flex: none; box-shadow: 0 0 0 2px var(--ink); display: inline-block; }
.lobby .code { color: var(--mari); letter-spacing: .1em; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plist li { display: flex; gap: 10px; align-items: center; background: var(--panel-2); padding: 8px 12px; border-radius: 12px; min-height: 48px; }
.plist small { color: var(--muted); }
.plist .x { margin-left: auto; }
.summary { margin: 0; }
i.on, i.off { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5fd38a; margin-left: 6px; vertical-align: middle; }
i.off { background: var(--rosa); }

/* ---------- Spiel ---------- */
.game { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; overflow: hidden; }
.top { display: flex; align-items: center; gap: 4px; padding: max(4px, env(safe-area-inset-top)) 6px 2px; background: var(--panel); border-bottom: 2px solid var(--mari); }
.top .title { font-family: var(--f-display); font-weight: 700; font-size: 21px; flex: 1; color: var(--mari-l); letter-spacing: .5px; }
.top .title small { color: var(--mari); letter-spacing: .1em; font-size: 15px; margin-left: 6px; }
.players { display: flex; gap: 6px; overflow-x: auto; padding: 12px 8px 8px; scrollbar-width: none; }
.players::-webkit-scrollbar { display: none; }
.pc {
  flex: 1 0 92px; max-width: 170px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 6px; text-align: left;
  background: #e6d7b8; color: var(--ink); border: 0; border-top: 5px solid var(--c); border-radius: 8px; padding: 5px 7px 6px; cursor: default; position: relative; min-width: 0;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .55);
}
.pc.turn { background: var(--bone); box-shadow: 0 3px 0 rgba(0, 0, 0, .55), 0 0 0 2px var(--mari); }
.pc.me .pn { text-decoration: underline; text-decoration-color: var(--c); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.pn { font-family: var(--f-display); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.pv { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1; min-width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; text-shadow: 0 1px 1px rgba(0, 0, 0, .6); box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .35); display: grid; place-items: center; }
.pi { grid-column: 1 / -1; display: flex; gap: 8px; font-size: 13px; color: var(--muted-ink); font-weight: 600; white-space: nowrap; }
.badges { position: absolute; top: -9px; right: 6px; display: flex; gap: 3px; }
.badges em { font-style: normal; font-size: 11px; font-weight: 700; background: var(--mari); color: var(--ink); border-radius: 5px; padding: 0 5px; box-shadow: 0 1px 0 var(--mari-d); }
.boardwrap { position: relative; min-height: 0; overflow: hidden; margin: 2px 6px 0; border-radius: 12px; box-shadow: inset 0 0 0 2px var(--mari), 0 6px 14px rgba(0, 0, 0, .45); background: #1f4e6b; }
#board { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.status {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); max-width: calc(100% - 24px);
  background: var(--panel); color: var(--mari-l); border-radius: 8px; padding: 6px 14px; font-family: var(--f-display); font-weight: 700; font-size: 15px; text-align: center; pointer-events: none;
  border: 1.5px solid var(--mari); box-shadow: 0 3px 8px rgba(0, 0, 0, .4);
}
.dice { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; pointer-events: none; }
.die { width: 38px; height: 38px; border-radius: 8px; background: var(--bone); color: var(--ink); font: 700 23px/38px var(--f-display); text-align: center; box-shadow: 0 3px 0 rgba(0, 0, 0, .6); }
.dice.roll .die { animation: shake .55s ease-out; }
.dice.roll .die:nth-child(2) { animation-delay: .06s; }
@keyframes shake { 0% { transform: rotate(-30deg) scale(.6); } 40% { transform: rotate(18deg) scale(1.15); } 70% { transform: rotate(-8deg); } 100% { transform: none; } }
.fit { position: absolute; left: 6px; top: 6px; background: rgba(30, 31, 34, .75); }

/* Brett */
.seahex { fill: rgba(255, 255, 255, .03); stroke: rgba(233, 207, 142, .08); stroke-width: 1; }
.tile polygon:first-child { stroke: rgba(0, 0, 0, .35); stroke-width: 1.2; }
.tshadow { fill: rgba(0, 0, 0, .45); }
.glaze { fill: url(#bev); stroke: rgba(0, 0, 0, .2); stroke-width: 1.2; }
.motif { opacity: .6; }
.fog polygon:first-child { stroke: rgba(0, 0, 0, .35); }
.swirl { fill: none; stroke: #9a9cA4; stroke-width: 2.2; stroke-linecap: round; opacity: .55; }
.fogq { font: 700 30px var(--f-display); fill: var(--mari-l); text-anchor: middle; }
.token { filter: drop-shadow(0 2px 1px rgba(0, 0, 0, .45)); }
.token circle:first-child { fill: url(#chip); stroke: rgba(0, 0, 0, .2); stroke-width: 1; }
.token text { font: 700 17px var(--f-display); fill: var(--ink); text-anchor: middle; }
.token text.small { font-size: 12px; }
.token.red text { fill: #9e2a1e; font-size: 19px; }
.token.red text.small { font-size: 12px; }
.token .pip { fill: var(--ink); }
.token.red .pip { fill: #9e2a1e; }
.token.unknown circle { fill: #cfc6b2; stroke-dasharray: 3 2; }
.token.unknown text { fill: var(--muted-ink); }
.pier { fill: none; stroke: var(--mari); stroke-width: 3; stroke-linecap: round; }
.hb-any { fill: var(--bone); stroke: var(--mari); stroke-width: 2; }
.hb-res { stroke: var(--mari); stroke-width: 2; }
.hb-t { font: 700 11px var(--f-body); fill: var(--ink); text-anchor: middle; }
.hb-t2 { font: 700 8px var(--f-body); fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--bone); stroke-width: 2.5; }
.robber { filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .35)); }
.road-o { stroke: rgba(0, 0, 0, .55); stroke-width: 9; stroke-linecap: round; }
.road { stroke-width: 6.5; stroke-linecap: round; }
.piece { stroke: rgba(0, 0, 0, .6); stroke-width: 1.3; stroke-linejoin: round; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .55)); }
.hit { fill: transparent; stroke: transparent; stroke-width: 18; cursor: pointer; }
circle.hit { stroke-width: 0; }
.tgt-under { stroke: var(--ink); stroke-width: 9; stroke-linecap: round; opacity: .55; pointer-events: none; }
.tgt-v { fill: var(--bone); stroke: var(--mari); stroke-width: 3.5; cursor: pointer; animation: pulse 1.1s ease-in-out infinite; }
.tgt-edge { stroke: var(--mari); stroke-width: 5; stroke-dasharray: 5 5; stroke-linecap: round; cursor: pointer; animation: dash 1s linear infinite; }
.tgt-city { fill: rgba(242, 165, 22, .25); stroke: var(--mari); stroke-width: 3.5; cursor: pointer; animation: pulse 1.1s ease-in-out infinite; }
.tgt-rep { fill: rgba(24, 163, 156, .25); stroke: var(--turq); stroke-width: 3.5; cursor: pointer; animation: pulse 1.1s ease-in-out infinite; }
.dmg { pointer-events: none; }
.dragon { filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .35)); }
.glut { position: absolute; top: 10px; left: 56px; background: rgba(30, 31, 34, .85); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 700; pointer-events: none; display: flex; gap: 6px; align-items: center; }
.glut i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255, 255, 255, .2); display: inline-block; }
.glut i.on { background: #ff6a2b; }
.tgt-hex { fill: rgba(242, 165, 22, .14); stroke: var(--mari); stroke-width: 3.5; cursor: pointer; }
.sel { stroke: var(--rosa) !important; animation: none !important; }
.tgt-v.sel { fill: var(--rosa); }
.tgt-hex.sel { fill: rgba(214, 36, 110, .25); }
.tgt-edge.sel { stroke-dasharray: none; stroke-width: 8; }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes dash { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) { .tgt-k path, .tgt-wall, .tgt-v, .tgt-edge, .tgt-city, .tgt-rep, .tgt-ship, .tgt-move, .dice.roll .die { animation: none; } }

/* Ablage unten */
.dock { background: var(--panel); border-top: 2px solid var(--mari); padding: 10px 8px max(10px, env(safe-area-inset-bottom)); display: grid; gap: 8px; margin-top: 8px; }
.hand { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.card {
  background: var(--bone); color: var(--ink); border-radius: 7px; padding: 4px 2px 3px; display: grid; justify-items: center; line-height: 1;
  border: 0; border-top: 5px solid var(--rc, var(--rosa)); min-width: 0; box-shadow: 0 3px 0 #000;
}
.card b { font: 700 21px var(--f-display); }
.card small { font-size: 11px; color: var(--muted-ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.card.dev { cursor: pointer; background: var(--panel-2); color: var(--mari-l); border-top-color: var(--mari); }
.card.dev small { color: var(--muted); }
.devico { font-size: 20px; color: var(--mari); height: 26px; line-height: 26px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 44px; }
.actions .btn { flex: 1 1 auto; padding-inline: 12px; }
.actions .ask { font-weight: 700; width: 100%; }
.actions .cost { display: flex; gap: 4px; flex: none; }
.rc { display: inline-flex; align-items: center; gap: 1px; background: var(--bone); color: var(--ink); border-radius: 5px; padding: 0 5px 0 2px; font-weight: 700; font-size: 14px; margin-right: 3px; }
.ico { vertical-align: middle; flex: none; }
.tradeb { background: var(--panel-2); border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; border-left: 4px solid var(--mari); }
.tradeb ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tradeb li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tradeb li small { color: var(--muted); }
.tline { font-weight: 700; }

/* Dialoge */
.modal { position: fixed; inset: 0; background: rgba(10, 10, 12, .6); display: grid; align-items: end; justify-items: center; z-index: 20; padding: 12px; }
.sheet {
  background: var(--panel); border-radius: 18px; padding: 20px 18px max(18px, env(safe-area-inset-bottom)); width: min(100%, 520px); max-height: 88dvh; overflow: auto; position: relative;
  border: 1.5px solid var(--mari); display: grid; gap: 10px; animation: up .18s ease-out; box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
@media (min-width: 700px) { .modal { align-items: center; } }
.sheet h2 { padding-right: 36px; margin: 0; }
.sheet h3 { margin: 6px 0 0; }
.close { position: absolute; right: 8px; top: 8px; }
.stps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.stp { background: var(--bone); color: var(--ink); border-radius: 8px; display: grid; justify-items: center; padding: 6px 2px; border-top: 5px solid var(--rc); box-shadow: 0 3px 0 #000; }
.stp small { font-size: 11px; color: var(--muted-ink); }
.sb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; }
.sb b { font: 700 20px var(--f-display); min-width: 18px; text-align: center; }
.sb button { appearance: none; border: 0; background: none; color: var(--ink); font-size: 22px; font-weight: 700; height: 38px; cursor: pointer; }
.sb button:disabled { opacity: .25; }
.pick { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pk { appearance: none; border: 3px solid transparent; background: var(--bone); color: var(--ink); border-radius: 8px; display: grid; justify-items: center; padding: 6px 2px; cursor: pointer; border-top: 5px solid var(--rc); box-shadow: 0 3px 0 #000; }
.pk.on { border-color: var(--mari); border-top-color: var(--rc); }
.pk:disabled { opacity: .35; cursor: not-allowed; }
.pk small { font-size: 11px; color: var(--muted-ink); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel-2); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { appearance: none; border: 0; background: none; border-radius: 9px; padding: 8px; font-weight: 700; cursor: pointer; }
.tabs .on { background: var(--bone); color: var(--ink); }
.sel { display: flex; align-items: center; gap: 10px; }
.sel select { flex: 1; }
.devs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.devs li { display: flex; gap: 10px; align-items: center; background: var(--panel-2); padding: 10px 12px; border-radius: 12px; }
.devs li div { flex: 1; display: grid; }
.devs small { color: var(--muted); }
.log { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; }
.log li { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.menu { display: grid; gap: 8px; }
.costs { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.costs li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; background: var(--panel-2); padding: 10px 12px; border-radius: 12px; }
.rules p { margin: 0 0 .7em; }

.hist { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; height: 120px; align-items: end; }
